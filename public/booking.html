<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Book a home sample collection</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500&family=Roboto+Slab:wght@500&display=swap">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="page">
  <div class="brand"><span class="dot"></span><h1>Your Diagnostic Centre &mdash; home collection</h1></div>

  <div class="card">
    <p class="muted" style="margin-bottom:12px;">Confirm your exact pickup location first &mdash; this is how our technician finds you.</p>
    <button id="use-location" class="btn-secondary" style="width:100%; margin-bottom:10px;">Use my current location</button>
    <div id="map" class="map tall"></div>
    <p class="muted" style="margin-top:10px;">Drag the pin if it isn't exactly on your door.</p>
  </div>

  <form id="booking-form" class="card">
    <label for="customerName">Full name</label>
    <input id="customerName" required>

    <label for="phone">Phone number</label>
    <input id="phone" type="tel" required>

    <label for="testType">Test</label>
    <select id="testType" required>
      <option value="">Select a test</option>
      <option>Complete blood count (CBC)</option>
      <option>Lipid profile</option>
      <option>Thyroid panel</option>
      <option>Diabetes panel (HbA1c)</option>
      <option>Full body checkup</option>
    </select>

    <label for="slot">Preferred date and time</label>
    <input id="slot" type="datetime-local" required>

    <label for="address">Address (for our records)</label>
    <textarea id="address" placeholder="Flat / house number, building, street, landmark"></textarea>

    <label for="notes">Anything the technician should know (optional)</label>
    <textarea id="notes" placeholder="e.g. gate code, fasting since morning"></textarea>

    <p id="form-error" class="muted" style="color:#C0392B; display:none;"></p>

    <button type="submit" class="btn-primary" style="margin-top:16px;">Confirm booking</button>
  </form>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  const DEFAULT_CENTER = [28.6139, 77.2090]; // fallback: New Delhi - change to your city
  const map = L.map('map').setView(DEFAULT_CENTER, 14);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap contributors'
  }).addTo(map);

  const marker = L.marker(DEFAULT_CENTER, { draggable: true }).addTo(map);
  let currentLatLng = { lat: DEFAULT_CENTER[0], lng: DEFAULT_CENTER[1] };

  marker.on('dragend', () => {
    const pos = marker.getLatLng();
    currentLatLng = { lat: pos.lat, lng: pos.lng };
  });

  map.on('click', (e) => {
    marker.setLatLng(e.latlng);
    currentLatLng = { lat: e.latlng.lat, lng: e.latlng.lng };
  });

  document.getElementById('use-location').addEventListener('click', () => {
    if (!navigator.geolocation) {
      alert('Location access is not available on this device/browser.');
      return;
    }
    navigator.geolocation.getCurrentPosition(
      (pos) => {
        const latlng = [pos.coords.latitude, pos.coords.longitude];
        map.setView(latlng, 17);
        marker.setLatLng(latlng);
        currentLatLng = { lat: latlng[0], lng: latlng[1] };
      },
      () => alert('Could not get your location. Please drag the pin to your address instead.'),
      { enableHighAccuracy: true, timeout: 10000 }
    );
  });

  document.getElementById('booking-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const errorEl = document.getElementById('form-error');
    errorEl.style.display = 'none';

    const payload = {
      customerName: document.getElementById('customerName').value.trim(),
      phone: document.getElementById('phone').value.trim(),
      testType: document.getElementById('testType').value,
      slot: document.getElementById('slot').value,
      address: document.getElementById('address').value.trim(),
      notes: document.getElementById('notes').value.trim(),
      lat: currentLatLng.lat,
      lng: currentLatLng.lng
    };

    try {
      const res = await fetch('/api/bookings', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      if (!res.ok) throw new Error('Booking failed.');
      const booking = await res.json();
      window.location.href = `track.html?id=${booking.id}`;
    } catch (err) {
      errorEl.textContent = 'Something went wrong. Please try again.';
      errorEl.style.display = 'block';
    }
  });
</script>
</body>
</html>
